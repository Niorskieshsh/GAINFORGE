
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: white;
        }

        /* FULL SCREEN PHOTO */
        .background {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background-image: url("sticker.jpg");
            background-size: cover;
            background-position: center;

            z-index: -2;
        }

        /* COLOR OVERLAY */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(30, 30, 50, 0.65);

            z-index: -1;
        }

        /* NAVIGATION BAR */
        .navbar {
            width: 100%;
            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);

            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .logout {
            padding: 10px 20px;

            border: none;
            border-radius: 8px;

            background: white;
            color: #333;

            cursor: pointer;
        }

        .logout:hover {
            background: #ddd;
        }

        /* MAIN CONTENT */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 30px;
        }

        /* WELCOME CARD */
        .welcome {
            padding: 35px;

            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);

            border-radius: 20px;

            border: 1px solid rgba(255, 255, 255, 0.2);

            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .welcome h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        .welcome p {
            margin: 0;
            opacity: 0.8;
        }

        /* CARDS */
        .cards {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 20px;

            margin-top: 25px;
        }

        .card {
            padding: 25px;

            background: rgba(255, 255, 255, 0.9);

            color: #333;

            border-radius: 15px;

            text-align: center;

            box-shadow: 0 10px 25px rgba(0,0,0,0.25);

            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            margin-top: 0;
        }

        .card p {
            color: #666;
        }

        .card button {
            padding: 10px 20px;

            border: none;
            border-radius: 8px;

            background: #333;
            color: white;

            cursor: pointer;
        }

        .card button:hover {
            background: #555;
        }

        /* MOBILE */
        @media (max-width: 700px) {

            .cards {
                grid-template-columns: 1fr;
            }

            .navbar {
                padding: 15px 20px;
            }

            .container {
                padding: 30px 20px;
            }

        }

    </style>
</head>

<body>

    <!-- PHOTO BACKGROUND -->
    <div class="background"></div>

    <!-- COLOR OVERLAY -->
    <div class="overlay"></div>


    <!-- NAVIGATION -->
    <nav class="navbar">

        <div class="logo">
            Dash Div
        </div>

        <button class="logout" onclick="logout()">
            Logout
        </button>

    </nav>


    <!-- MAIN CONTENT -->
    <main class="container">

        <!-- WELCOME -->
        <section class="welcome">

            <h1>Welcome, Niorskie!</h1>

            <p>
                You have successfully logged in to your account.
            </p>

        </section>


        <!-- DASHBOARD CARDS -->
        <section class="cards">

            <div class="card">

                <img src="https://i.pinimg.com/736x/92/27/72/922772e3d9be6c38f3461cbc00a60faf.jpg"
            alt="Profile Image"
            style="width: 100px; height: 100px object-fit: cover; border-radius: 50%; margin-bottom: 15px;">

                

                <h2>Project</h2>

                <p>
                    View your project information.
                </p>

                <button>
                    View Project
                </button>

            </div>


            <div class="card">

                <h2>📊</h2>

                <h2>Dashboard</h2>

                <p>
                    View your account information.
                </p>

                <button>
                    View Details
                </button>

            </div>


            <div class="card">

                <h2>⚙️</h2>

                <h2>Settings</h2>

                <p>
                    Manage your account settings.
                </p>

                <button>
                    Settings
                </button>

            </div>

        </section>

    </main>


    <!-- JAVASCRIPT -->
    <script>

        function logout() {

            window.location.href = "index.html";

        }

    </script>

</body>

</html>

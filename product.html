/* =====================================================
   GET PRODUCT ID FROM URL
===================================================== */

const urlParams =
    new URLSearchParams(window.location.search);


const productId =
    urlParams.get("id");


/* =====================================================
   GET SELECTED PRODUCT
===================================================== */

const product =
    products[productId];


/* =====================================================
   DISPLAY PRODUCT
===================================================== */

function displayProduct() {

    const container =
        document.getElementById(
            "product-container"
        );


    /* PRODUCT DOES NOT EXIST */

    if (!product) {

        container.innerHTML = `

            <div class="product-not-found">

                <h1>
                    PRODUCT NOT FOUND
                </h1>

                <p>
                    Sorry, we couldn't find that product.
                </p>

                <a
                    href="index.html"
                    class="back-home"
                >
                    BACK TO HOME
                </a>

            </div>

        `;

        return;

    }


    /* CREATE STAR RATING */

    let stars = "";


    for (
        let i = 1;
        i <= 5;
        i++
    ) {

        if (i <= product.rating) {

            stars += "★";

        }

        else {

            stars += "☆";

        }

    }


    /* CREATE BENEFITS */

    let benefitsHTML = "";


    product.benefits.forEach(
        function(benefit) {

            benefitsHTML += `

                <li>
                    ${benefit}
                </li>

            `;

        }
    );


    /* DISPLAY */

    container.innerHTML = `

        <div class="product-container">


            <!-- IMAGE -->

            <div class="product-image">

                <img
                    src="${product.image}"
                    alt="${product.name}"
                >

            </div>


            <!-- INFORMATION -->

            <div class="product-info">


                <h1>
                    ${product.name}
                </h1>


                <div class="rating">

                    <span class="stars">
                        ${stars}
                    </span>

                    <span class="rating-number">
                        ${product.rating}.0
                    </span>

                    <span class="sold">
                        ${product.sold} sold
                    </span>

                </div>


                <p class="price">

                    ₱${product.price.toLocaleString()}

                </p>


                <p class="description">

                    ${product.description}

                </p>


                <h2>
                    WHAT IS IT FOR?
                </h2>


                <ul class="benefits">

                    ${benefitsHTML}

                </ul>


                <p class="quantity-title">
                    Quantity
                </p>


                <div class="quantity">

                    <button
                        onclick="decreaseQuantity()"
                    >
                        −
                    </button>


                    <span id="quantity">
                        1
                    </span>


                    <button
                        onclick="increaseQuantity()"
                    >
                        +
                    </button>

                </div>


                <div class="product-buttons">


                    <button
                        class="add-cart"
                        onclick="addToCart()"
                    >
                        ADD TO CART
                    </button>


                    <button
                        class="checkout-btn"
                        onclick="checkoutNow()"
                    >
                        CHECK OUT
                    </button>


                </div>


            </div>

        </div>

    `;

}


/* =====================================================
   QUANTITY
===================================================== */

let quantity = 1;


function increaseQuantity() {

    quantity++;

    document.getElementById(
        "quantity"
    ).textContent = quantity;

}


function decreaseQuantity() {

    if (quantity > 1) {

        quantity--;

    }

    document.getElementById(
        "quantity"
    ).textContent = quantity;

}


/* =====================================================
   CART
===================================================== */

function getCart() {

    return JSON.parse(
        localStorage.getItem(
            "gainforgeCart"
        )
    ) || [];

}


function saveCart(cart) {

    localStorage.setItem(
        "gainforgeCart",
        JSON.stringify(cart)
    );

}


/* =====================================================
   UPDATE CART COUNT
===================================================== */

function updateCartCount() {

    const cart = getCart();

    let totalItems = 0;


    cart.forEach(
        function(item) {

            totalItems += item.quantity;

        }
    );


    document.getElementById(
        "cart-count"
    ).textContent = totalItems;

}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart() {

    let cart = getCart();


    const existingProduct =
        cart.find(
            function(item) {

                return item.name === product.name;

            }
        );


    if (existingProduct) {

        existingProduct.quantity += quantity;

    }

    else {

        cart.push({

            id: productId,

            name: product.name,

            price: product.price,

            image: product.image,

            quantity: quantity

        });

    }


    saveCart(cart);

    updateCartCount();


    /* BUTTON FEEDBACK */

    const button =
        document.querySelector(
            ".add-cart"
        );


    button.textContent =
        "ADDED ✓";


    button.style.background =
        "#17c12a";

    button.style.color =
        "#000";


    setTimeout(
        function() {

            button.textContent =
                "ADD TO CART";

            button.style.background =
                "";

            button.style.color =
                "";

        },
        1000
    );

}


/* =====================================================
   CHECKOUT NOW
===================================================== */

function checkoutNow() {

    let cart = getCart();


    const existingProduct =
        cart.find(
            function(item) {

                return item.name === product.name;

            }
        );


    if (existingProduct) {

        existingProduct.quantity += quantity;

    }

    else {

        cart.push({

            id: productId,

            name: product.name,

            price: product.price,

            image: product.image,

            quantity: quantity

        });

    }


    saveCart(cart);


    window.location.href =
        "checkout.html";

}
